[project]
name = "market_research_and_business_analysis_crew"
version = "0.1.0"
description = "Market_Research_and_Business_Analysis_Crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai,tools]>=1.15.17,<2.0.0",
    "selenium>=4.47.0",
    "webdriver-manager>=4.1.2",
]

[project.scripts]
market_research_and_business_analysis_crew = "market_research_and_business_analysis_crew.main:run"
run_crew = "market_research_and_business_analysis_crew.main:run"
train = "market_research_and_business_analysis_crew.main:train"
replay = "market_research_and_business_analysis_crew.main:replay"
test = "market_research_and_business_analysis_crew.main:test"
run_with_trigger = "market_research_and_business_analysis_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "ade41e08-c741-4f33-9c17-914eee46ad08"
